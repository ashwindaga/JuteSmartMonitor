name: JuteSmart Order Monitor

on:
  schedule:
    # Every 15 min, 9am-9pm IST (Mon-Sat)
    # IST = UTC+5:30, so 9am IST = 03:30 UTC, 9pm IST = 15:30 UTC
    - cron: '*/15 3-15 * * 1-6'

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        env:
          JUTECOMM_USERNAME_1:  ${{ secrets.JUTECOMM_USERNAME_1 }}
          JUTECOMM_PASSWORD_1:  ${{ secrets.JUTECOMM_PASSWORD_1 }}
          JUTECOMM_USERNAME_2:  ${{ secrets.JUTECOMM_USERNAME_2 }}
          JUTECOMM_PASSWORD_2:  ${{ secrets.JUTECOMM_PASSWORD_2 }}
          JUTECOMM_USERNAME_3:  ${{ secrets.JUTECOMM_USERNAME_3 }}
          JUTECOMM_PASSWORD_3:  ${{ secrets.JUTECOMM_PASSWORD_3 }}
          JUTECOMM_USERNAME_4:  ${{ secrets.JUTECOMM_USERNAME_4 }}
          JUTECOMM_PASSWORD_4:  ${{ secrets.JUTECOMM_PASSWORD_4 }}
          GMAIL_SENDER:         ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:          ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py

      - name: Save updated snapshot back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen_orders.json
          git diff --staged --quiet || git commit -m "chore: update order snapshot [skip ci]"
          git push

      - name: Keep workflow alive
        run: gh run list --workflow=monitor.yml --limit=1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
