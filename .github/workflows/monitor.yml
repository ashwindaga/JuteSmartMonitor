name: JuteSmart Order Monitor

on:
  schedule:
    # Runs every 15 minutes (GitHub's minimum interval)
    # Note: GitHub may delay by up to 5 min under high load
    - cron: '*/15 * * * *'

  # Allows you to trigger a run manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    # Give the job write access so it can commit the updated snapshot
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        env:
          JUTECOMM_USERNAME:   ${{ secrets.JUTECOMM_USERNAME }}
          JUTECOMM_PASSWORD:   ${{ secrets.JUTECOMM_PASSWORD }}
          GMAIL_SENDER:        ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:         ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py

      - name: Save updated snapshot back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen_orders.json
          git diff --staged --quiet || git commit -m "chore: update order snapshot [skip ci]"
          git push
keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v1
