name: Bill Status Monitor
on:
  schedule:
    # Every 30 min (at :07 and :37, offset from the order monitor), roughly
    # 9am-9pm IST, Monday-Saturday (cron is in UTC)
    - cron: "7,37 3-15 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bill-status-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check bills on JuteSmart
        env:
          JUTECOMM_USERNAME_1: ${{ secrets.JUTECOMM_USERNAME_1 }}
          JUTECOMM_PASSWORD_1: ${{ secrets.JUTECOMM_PASSWORD_1 }}
          JUTECOMM_USERNAME_2: ${{ secrets.JUTECOMM_USERNAME_2 }}
          JUTECOMM_PASSWORD_2: ${{ secrets.JUTECOMM_PASSWORD_2 }}
          JUTECOMM_USERNAME_3: ${{ secrets.JUTECOMM_USERNAME_3 }}
          JUTECOMM_PASSWORD_3: ${{ secrets.JUTECOMM_PASSWORD_3 }}
          JUTECOMM_USERNAME_4: ${{ secrets.JUTECOMM_USERNAME_4 }}
          JUTECOMM_PASSWORD_4: ${{ secrets.JUTECOMM_PASSWORD_4 }}
          JUTECOMM_USERNAME_5: ${{ secrets.JUTECOMM_USERNAME_5 }}
          JUTECOMM_PASSWORD_5: ${{ secrets.JUTECOMM_PASSWORD_5 }}
        run: python bill_status.py

      - name: Save snapshots
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bill_snapshots/
          git diff --cached --quiet || (git commit -m "Update bill status snapshots" && git pull --rebase && git push)
